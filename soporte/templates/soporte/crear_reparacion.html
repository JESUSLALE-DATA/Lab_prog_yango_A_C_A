{% extends 'soporte/base.html' %}

{% block title %}Nueva Reparación{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-plus-circle text-primary me-2"></i>Nueva Reparación
                    </h4>
                    <p class="text-muted mb-0 mt-1">Registra un nuevo trabajo de reparación</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="tecnico" class="form-label fw-semibold">Técnico asignado *</label>
                            <select name="tecnico" id="tecnico" class="form-select" required>
                                <option value="">— Seleccionar técnico —</option>
                                {% for t in tecnicos %}
                                <option value="{{ t.id }}">{{ t.nombre }} {{ t.apellido }} ({{ t.especialidad }})</option>
                                {% endfor %}
                            </select>
                            {% if not tecnicos %}
                            <div class="form-text text-danger">
                                No hay técnicos. <a href="{% url 'crear_tecnico' %}">Crea uno primero</a>.
                            </div>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label for="diagnostico" class="form-label fw-semibold">Diagnóstico</label>
                            <textarea name="diagnostico" id="diagnostico" class="form-control" rows="3"
                                      placeholder="Describe el problema del equipo..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fecha_entrega" class="form-label fw-semibold">Fecha estimada de entrega</label>
                                <input type="date" name="fecha_entrega" id="fecha_entrega" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label fw-semibold">Estado inicial</label>
                                <select name="estado" id="estado" class="form-select">
                                    {% for value, label in estados %}
                                    <option value="{{ value }}" {% if value == 'ESPERA' %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="solucion" class="form-label fw-semibold">Solución (opcional)</label>
                            <textarea name="solucion" id="solucion" class="form-control" rows="2"
                                      placeholder="Si ya hay una solución aplicada..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary" {% if not tecnicos %}disabled{% endif %}>
                                <i class="bi bi-check-circle me-1"></i> Crear Reparación
                            </button>
                            <a href="{% url 'lista_reparaciones' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
