{% extends 'soporte/base.html' %}

{% block title %}Editar Reparación{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-pencil-square text-primary me-2"></i>Editar Reparación #{{ reparacion.id }}
                    </h4>
                    <p class="text-muted mb-0 mt-1">Técnico: {{ reparacion.tecnico.nombre }} {{ reparacion.tecnico.apellido }}</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="diagnostico" class="form-label fw-semibold">Diagnóstico</label>
                            <textarea name="diagnostico" id="diagnostico" class="form-control" rows="3"
                                      placeholder="Describe el problema...">{{ reparacion.diagnostico }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fecha_entrega" class="form-label fw-semibold">Fecha de entrega</label>
                                <input type="date" name="fecha_entrega" id="fecha_entrega" class="form-control"
                                       value="{{ reparacion.fecha_entrega|date:'Y-m-d' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label fw-semibold">Estado</label>
                                <select name="estado" id="estado" class="form-select">
                                    <option value="ESPERA" {% if reparacion.estado == "ESPERA" %}selected{% endif %}>En espera</option>
                                    <option value="REPARANDO" {% if reparacion.estado == "REPARANDO" %}selected{% endif %}>En reparación</option>
                                    <option value="FINALIZADO" {% if reparacion.estado == "FINALIZADO" %}selected{% endif %}>Finalizado</option>
                                    <option value="ENTREGADO" {% if reparacion.estado == "ENTREGADO" %}selected{% endif %}>Entregado</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="solucion" class="form-label fw-semibold">Solución</label>
                            <textarea name="solucion" id="solucion" class="form-control" rows="3"
                                      placeholder="Describe la solución aplicada...">{{ reparacion.solucion }}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i> Guardar cambios
                            </button>
                            <a href="{% url 'lista_reparaciones' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
