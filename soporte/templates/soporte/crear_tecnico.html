{% extends 'soporte/base.html' %}

{% block title %}Nuevo Técnico{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-plus text-primary me-2"></i>Nuevo Técnico
                    </h4>
                    <p class="text-muted mb-0 mt-1">Completa los datos del técnico</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre *</label>
                                <input type="text" name="nombre" id="nombre" class="form-control" required
                                       placeholder="Ej: Juan">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label fw-semibold">Apellido</label>
                                <input type="text" name="apellido" id="apellido" class="form-control"
                                       placeholder="Ej: Pérez">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="especialidad" class="form-label fw-semibold">Especialidad *</label>
                            <input type="text" name="especialidad" id="especialidad" class="form-control" required
                                   placeholder="Ej: Hardware, Software, Redes...">
                        </div>

                        <div class="mb-4">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" id="email" class="form-control"
                                   placeholder="tecnico@ejemplo.com">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i> Guardar Técnico
                            </button>
                            <a href="{% url 'lista_tecnicos' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
